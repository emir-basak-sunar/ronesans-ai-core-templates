apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ronesans-vector-serving
  annotations:
    scenarios.ai.sap.com/id: "material-management"
    scenarios.ai.sap.com/name: "Ronesans Material Management"
    scenarios.ai.sap.com/description: "Vector Embedding and pgvector Service"
    executables.ai.sap.com/name: "vector-service"
    executables.ai.sap.com/description: "Embedding and pgvector Search REST API"
  labels:
    scenarios.ai.sap.com/id: "material-management"
    ai.sap.com/version: "1.0.0"
spec:
  imagePullSecrets:
    - name: docker-hub-secret
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    spec:
      predictor:
        minReplicas: 1
        maxReplicas: 2
        imagePullSecrets:
          - name: docker-hub-secret
        containers:
          - name: kserve-container
            image: "docker.io/btcecm/ronesans-vector:latest"
            ports:
              - containerPort: 8081
                protocol: TCP
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
