apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ronesans-parser-exec
  annotations:
    scenarios.ai.sap.com/name: "Ronesans Material Management"
    scenarios.ai.sap.com/description: "ByT5 Deep Learning Material Parser"
    executables.ai.sap.com/name: "material-parser"
    executables.ai.sap.com/description: "ByT5 Parser REST API"
  labels:
    scenarios.ai.sap.com/id: "material-management"
    ai.sap.com/version: "1.0.0"
spec:
  template:
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: parser-service
    spec:
      predictor:
        minReplicas: 1
        maxReplicas: 2
        imagePullSecrets:
          - name: docker-hub-secret
        containers:
          - image: "docker.io/btcecm/ronesans-parser:latest"
            ports:
              - containerPort: 8080
                protocol: TCP
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
