apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ronesans-parser-exec
  annotations:
    scenarios.ai.sap.com/name: "Ronesans Material Management"
    scenarios.ai.sap.com/description: "ByT5 Deep Learning Material Parser"
    executables.ai.sap.com/name: "material-parser"
    executables.ai.sap.com/description: "ByT5 Parser REST API"
  labels:
    scenarios.ai.sap.com/id: "material-management"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters:
      - name: resourcePlan
        type: string
        default: "infer.m"
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 10
      labels: |
        ai.sap.com/resourcePlan: "{{inputs.parameters.resourcePlan}}"
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 2
        imagePullSecrets:
          - name: docker-hub-secret
        containers:
          - name: kserve-container
            image: docker.io/btcecm/ronesans-parser:latest
            ports:
              - containerPort: 8080
                protocol: TCP
            resources:
              requests:
                cpu: "1000m"
                memory: "2Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
