apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ronesans-parser-serving
  annotations:
    scenarios.ai.sap.com/name: "material-management"
    scenarios.ai.sap.com/description: "Ronesans Material Management"
    executables.ai.sap.com/name: "material-parser"
    executables.ai.sap.com/description: "ByT5 Deep Learning Material Parser API"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters: []
  template:
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: "{{.Labels.isvc}}"
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      predictor:
        minReplicas: 1
        maxReplicas: 2
        containers:
          - name: kserve-container
            image: "docker.io/btcecm/ronesans-parser:latest"
            ports:
              - containerPort: 8080
                protocol: TCP
            imagePullSecrets:
              - name: docker-hub-secret
            resources:
              requests:
                cpu: "1000m"
                memory: "2Gi"
              limits:
                cpu: "2000m"
                memory: "4Gi"
