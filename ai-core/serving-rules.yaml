apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ronesans-rules-exec
  annotations:
    scenarios.ai.sap.com/name: "Ronesans Material Management"
    scenarios.ai.sap.com/description: "Material Error and Taxonomy Order Detection Rules Engine"
    executables.ai.sap.com/name: "rules-service"
    executables.ai.sap.com/description: "Rules and Validation REST API"
  labels:
    scenarios.ai.sap.com/id: "material-management"
    ai.sap.com/version: "1.0.0"
spec:
  inputs:
    parameters:
      - name: resourcePlan
        type: string
        default: "infer.s"
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 10
      labels: |
        ai.sap.com/resourcePlan: "{{inputs.parameters.resourcePlan}}"
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 2
        imagePullSecrets:
          - name: docker-hub-secret
        containers:
          - name: kserve-container
            image: docker.io/btcecm/ronesans-rules:latest
            ports:
              - containerPort: 8080
                protocol: TCP
            env:
              - name: PARSER_URL
                value: "https://api.ai.prod-eu20.westeurope.azure.ml.hana.ondemand.com/v2/inference/deployments/d4c3631d32997e38/v2/parse"
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1000m"
                memory: "2Gi"
